name: Withings to Garmin Sync

on:
  schedule:
    # 6 ganger/dag — innenfor Garmins anbefalte grense (maks 8-10/dag)
    - cron: '0 5,8,11,14,17,20 * * *'
  workflow_dispatch:  # lar deg trigge manuelt fra GitHub Actions-fanen

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install withings-sync
        run: pip install withings-sync

      - name: Restore sesjonsfiler fra secrets
        env:
          WITHINGS_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_JSON: ${{ secrets.GARMIN_SESSION_JSON }}
        run: |
          mkdir -p config withings_data
          printf '%s' "$WITHINGS_JSON" > config/.withings_user.json
          printf '%s' "$GARMIN_JSON" > config/.garmin_session.json

      - name: Installer jq
        run: sudo apt-get install -y jq

      - name: Kjør sync (Garmin + generer dashboard-data)
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          withings-sync --config-folder config \
            --to-json \
            --output withings_data/latest

      - name: Slå sammen ny data inn i docs/data.json
        run: |
          mkdir -p docs
          if [ -f withings_data/latest.json ]; then
            if [ -f docs/data.json ]; then
              jq -s '.[0] * .[1]' docs/data.json withings_data/latest.json > docs/data.json.tmp
              mv docs/data.json.tmp docs/data.json
            else
              cp withings_data/latest.json docs/data.json
            fi
          fi

      - name: Installer garminconnect
        run: pip install garminconnect

      - name: Hent søvn, HRV og hvilepuls direkte fra Garmin
        continue-on-error: true
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          mkdir -p docs
          python3 scripts/garmin_health.py

      - name: Commit rådata (kroppssammensetning) til repoet
        run: |
          git config user.name "withings-sync-bot"
          git config user.email "actions@github.com"
          git add withings_data/ docs/ || true
          git diff --cached --quiet || git commit -m "Withings data $(date -u +%F)"
          git pull --rebase origin main
          git push
