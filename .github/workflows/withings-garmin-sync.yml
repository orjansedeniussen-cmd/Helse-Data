name: Withings to Garmin Sync

on:
  schedule:
    # 6 ganger/dag — innenfor Garmins anbefalte grense (maks 8-10/dag)
    - cron: '0 5,8,11,14,17,20 * * *'
  workflow_dispatch:  # lar deg trigge manuelt fra GitHub Actions-fanen

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install withings-sync
        run: pip install withings-sync

      - name: Restore sesjonsfiler fra secrets
        env:
          WITHINGS_JSON: ${{ secrets.WITHINGS_USER_JSON }}
          GARMIN_JSON: ${{ secrets.GARMIN_SESSION_JSON }}
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_CONNECT_TOKENS }}
        run: |
          mkdir -p config withings_data config/garmintokens
          printf '%s' "$WITHINGS_JSON" > config/.withings_user.json
          printf '%s' "$GARMIN_JSON" > config/.garmin_session.json
          if [ -n "$GARMIN_TOKENS_JSON" ]; then
            printf '%s' "$GARMIN_TOKENS_JSON" > config/garmintokens/garmin_tokens.json
          fi

      - name: Installer jq
        run: sudo apt-get install -y jq

      - name: Kjør sync (Garmin + generer dashboard-data)
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          # --fromdate/--todate: uten disse henter withings-sync KUN dagens
          # dato. Da forsvinner en dag for godt hvis akkurat den kjøringen
          # feiler (f.eks. en midlertidig 503 fra Withings), siden neste
          # kjøring bare sjekker "i dag", aldri bakover. Ved å alltid hente
          # de siste 14 dagene fanges eventuelle hull automatisk opp igjen.
          withings-sync --config-folder config \
            --to-json \
            --output withings_data/latest \
            --fromdate "$(date -u -d '14 days ago' +%Y-%m-%d)" \
            --todate "$(date -u +%Y-%m-%d)"

      - name: Lagre eventuelt fornyet Withings-token tilbake til secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Withings roterer refresh-tokenet ved hver fornyelse - det gamle
          # blir ugyldig med én gang. Uten dette steget ville vi alltid
          # gjenbrukt det samme, utdaterte tokenet fra secreten, og synken
          # ville sluttet å virke etter den aller første vellykkede kjøringen.
          # Sikkerhetssjekken hindrer at et korrupt/tomt token (kjent bug i
          # withings-sync ved API-feil) noensinne overskriver en gyldig secret.
          if [ -f config/.withings_user.json ]; then
            if python3 -c "import json,sys; d=json.load(open('config/.withings_user.json')); sys.exit(0 if d.get('refresh_token') else 1)"; then
              gh secret set WITHINGS_USER_JSON --repo "$GITHUB_REPOSITORY" < config/.withings_user.json
              echo "Withings-token oppdatert i secret."
            else
              echo "Advarsel: nytt token ser korrupt/tomt ut - beholder gammel secret uendret."
            fi
          fi

      - name: Slå sammen ny data inn i docs/data.json
        run: |
          mkdir -p docs
          if [ -f withings_data/latest.json ]; then
            if [ -f docs/data.json ]; then
              jq -s '.[0] * .[1]' docs/data.json withings_data/latest.json > docs/data.json.tmp
              mv docs/data.json.tmp docs/data.json
            else
              cp withings_data/latest.json docs/data.json
            fi
          fi

      - name: Installer garminconnect (med curl_cffi for widget-innlogging)
        run: pip install --upgrade garminconnect curl_cffi

      - name: Hent søvn, HRV og hvilepuls direkte fra Garmin
        continue-on-error: true
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          mkdir -p docs
          python3 scripts/garmin_health.py

      - name: Hent treningsøkter fra Strava
        continue-on-error: true
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          mkdir -p docs
          python3 scripts/strava_sync.py

      - name: Commit rådata (kroppssammensetning) til repoet
        run: |
          git config user.name "withings-sync-bot"
          git config user.email "actions@github.com"
          git add withings_data/ docs/ || true
          git diff --cached --quiet || git commit -m "Withings data $(date -u +%F)"
          git pull --rebase origin main
          git push
