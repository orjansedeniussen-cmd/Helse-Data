<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ørjan — Treningsapp</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT">
<link rel="icon" href="pwa-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="pwa-icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --card-input: #161616;
    --teaser: #2a2a1a;
    --text: #f4f3f1;
    --muted-4: rgba(244,243,241,.4);
    --muted-5: rgba(244,243,241,.5);
    --muted-55: rgba(244,243,241,.55);
    --muted-6: rgba(244,243,241,.6);
    --muted-75: rgba(244,243,241,.75);
    --muted-8: rgba(244,243,241,.8);
    --accent: #c8ff3d;
    --orange: oklch(78% 0.19 50);
    --blue: oklch(78% 0.16 250);
    --violet: oklch(75% 0.18 310);
    --good: #8ee66b;
    --bad: oklch(68% 0.19 25);
    --neutral: rgba(244,243,241,.5);
    --strava: #fc5200;
    --garmin: #0077c8;
    --withings: #9ca3af;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  #device {
    width: 100%;
    max-width: 420px;
    min-height: 780px;
    background: var(--bg);
    border-radius: 36px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.06);
  }
  #content {
    flex: 1;
    overflow: auto;
    padding: 22px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1.title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .greeting-date { font-size: 13px; color: var(--muted-55); font-weight: 500; }
  .greeting-hi { font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }

  .card { background: var(--card); border-radius: 20px; padding: 18px 20px; }
  .card.tight { padding: 16px; }
  .card.list-item { padding: 14px 16px; border-radius: 16px; }
  .teaser { background: var(--teaser); border-radius: 20px; padding: 14px 16px; }

  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; }
  .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap16 { gap: 16px; }

  .stat-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .source-card { background: var(--card); border-radius: 16px; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .source-card .dot { width: 8px; height: 8px; border-radius: 50%; }
  .source-card .metric { font-size: 14px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .source-card .label { font-size: 9.5px; color: var(--muted-55); }

  .silhouette { border-radius: 14px; background: var(--card); position: relative; flex: none; overflow: hidden; cursor: pointer; }
  .silhouette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .silhouette .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; color: var(--muted-4); padding: 6px; }

  .toggle-row { display: flex; gap: 8px; font-size: 9.5px; font-weight: 600; }
  .toggle-row span { cursor: pointer; }

  input[type="number"], input[type="time"], input[type="text"], textarea {
    background: var(--card-input);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    outline: none;
  }

  .tab-bar { flex: none; display: flex; padding: 8px 8px 4px; gap: 2px; border-top: 1px solid rgba(255,255,255,.06); background: var(--bg); }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; cursor: pointer; }
  .tab-btn .label { font-size: 9.5px; font-weight: 600; }

  .chat-bubble { max-width: 78%; border-radius: 14px; padding: 9px 13px; font-size: 13px; line-height: 1.4; }
  .chat-thread { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: auto; min-height: 200px; max-height: 340px; }

  .meal-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .meal-box { width: 18px; height: 18px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #121212; font-weight: 700; }

  .empty-state { font-size: 12px; color: var(--muted-5); line-height: 1.5; padding: 6px 2px; }
  .badge { font-size: 9px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted-6); font-weight: 600; }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="device">
  <div id="content"></div>
  <div class="tab-bar" id="tabBar"></div>
</div>

<script>
/* ===================== Konstanter / design-tokens ===================== */
const ACCENT = 'var(--accent)';
const TABS = ['Hjem', 'Kropp', 'Logg', 'Fremgang', 'Kost', 'Coach'];
const WITHINGS_URL = 'data.json';
const GARMIN_URL = 'garmin_health.json';
const STRAVA_URL = 'strava.json';
const STORAGE_KEY = 'pt-app-state-v1';

const MEAL_LABELS = {
  vegetables: 'Rikelig grønnsaker', fish: 'Fisk / sjømat', oliveOil: 'Olivenolje som fettkilde',
  wholegrain: 'Fullkorn', nuts: 'Nøtter / frø',
};

/* ===================== State ===================== */
const State = {
  tab: 0,
  withingsRows: [],
  garminRows: [],
  stravaData: null,
  manual: loadManual(),
};

function loadManual() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(defaultManual(), JSON.parse(raw));
  } catch (e) {}
  return defaultManual();
}
function defaultManual() {
  return {
    hrv: null, hrvManual: false,
    sleep: null, sleepManual: false,
    bodyBattery: null, bbManual: false,
    silhouetteSide: 'front',
    photos: { front: null, back: null },
    targetFatPercent: 20,
    fastingStart: '12:00', fastingEnd: '20:00',
    nutritionNotes: '',
    meals: { vegetables: false, fish: false, oliveOil: false, wholegrain: false, nuts: false },
    chatMessages: [
      { from: 'coach', text: 'Hei! Jeg er coachen din — spør meg om trening, søvn eller kosthold, basert på dine egne tall.' }
    ],
  };
}
function saveManual() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(State.manual)); } catch (e) {}
}

/* ===================== Hjelpefunksjoner ===================== */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function fmt1(v) { return (v == null || isNaN(v)) ? null : Math.round(v * 10) / 10; }
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fastingHours(start, end) {
  const [sh, sm] = start.split(':').map(Number), [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return (mins / 60).toFixed(1).replace(/\.0$/, '');
}

function svgLine(data, color, w, h) {
  if (!data || data.length < 2) return `<div class="empty-state">Ikke nok datapunkter ennå.</div>`;
  const min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * (w - 8) + 4;
    const y = h - 6 - ((v - min) / (max - min || 1)) * (h - 12);
    return [x, y];
  });
  const points = pts.map(p => p.join(',')).join(' ');
  const last = pts[pts.length - 1];
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}"/>
  </svg>`;
}
function svgMultiLine(series, w, h) {
  const usable = series.filter(s => s.data && s.data.length >= 2);
  if (usable.length === 0) return `<div class="empty-state">Ikke nok datapunkter ennå — trenden vokser etter hvert som flere dager logges.</div>`;
  const parts = usable.map(s => {
    const min = Math.min(...s.data), max = Math.max(...s.data);
    const pts = s.data.map((v, i) => {
      const x = (i / (s.data.length - 1)) * (w - 8) + 4;
      const y = h - 6 - ((v - min) / (max - min || 1)) * (h - 12);
      return [x, y];
    });
    const last = pts[pts.length - 1];
    return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${s.color}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${parts}</svg>`;
}
function svgBar(data, color, w, h, dimColor) {
  if (!data || data.length === 0) return `<div class="empty-state">Ingen data ennå.</div>`;
  const max = Math.max(...data) || 1;
  const bw = (w / data.length) * 0.55;
  const gap = (w / data.length) - bw;
  const bars = data.map((v, i) => {
    const bh = (v / max) * (h - 8);
    const x = i * (bw + gap) + gap / 2;
    const fill = i === data.length - 1 ? color : (dimColor || color);
    return `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" rx="3" fill="${fill}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

/* ===================== Datahenting ===================== */
function classifyWithings(fieldName) {
  const n = fieldName.toLowerCase();
  if (n.includes('segment')) return null; // kroppsdel-nedbrytning, ikke helkroppstall — hopp over
  if (n.includes('fat') && n.includes('ratio')) return 'fat_ratio';
  if (n.includes('fat') && (n.includes('mass') || n.includes('weight'))) return 'fat_mass';
  if (n.includes('muscle')) return 'muscle_mass';
  if (n.includes('bone')) return 'bone_mass';
  if (n.includes('bmi')) return 'bmi';
  if (n.includes('weight') && !n.includes('fat')) return 'weight';
  return null;
}
function parseWithings(raw) {
  const rows = [];
  if (!raw || typeof raw !== 'object') return rows;
  for (const [dtStr, fields] of Object.entries(raw)) {
    if (!fields || typeof fields !== 'object') continue;
    const row = { date: dtStr.slice(0, 10), _dt: dtStr };
    for (const [fieldName, obj] of Object.entries(fields)) {
      if (!obj || typeof obj !== 'object' || obj.Value == null) continue;
      const key = classifyWithings(fieldName);
      if (key) row[key] = obj.Value;
    }
    if (row.weight !== undefined) rows.push(row);
  }
  return rows.sort((a, b) => a._dt.localeCompare(b._dt));
}

function extractGarminDay(entry) {
  const out = {};
  if (!entry) return out;
  if (entry.stats) {
    out.restingHeartRate = entry.stats.restingHeartRate ?? entry.stats.restingHeartRateInBeatsPerMinute ?? null;
    out.bodyBattery = entry.stats.bodyBatteryMostRecentValue ?? entry.stats.mostRecentBodyBattery ?? null;
  }
  if (entry.sleep) {
    const dto = entry.sleep.dailySleepDTO || entry.sleep;
    const totalSec = dto && dto.sleepTimeSeconds;
    if (totalSec) out.sleepHours = totalSec / 3600;
  }
  if (entry.hrv) {
    const summary = entry.hrv.hrvSummary || entry.hrv;
    out.hrvLastNight = summary ? (summary.lastNightAvg ?? summary.lastNight5MinHigh ?? null) : null;
  }
  return out;
}
function parseGarmin(json) {
  const rows = [];
  if (!json || typeof json !== 'object') return rows;
  for (const [date, entry] of Object.entries(json)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    rows.push({ date, ...extractGarminDay(entry) });
  }
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

async function loadData() {
  try {
    const res = await fetch(WITHINGS_URL + '?_=' + Date.now());
    if (res.ok) State.withingsRows = parseWithings(await res.json());
  } catch (e) {}
  try {
    const res = await fetch(GARMIN_URL + '?_=' + Date.now());
    if (res.ok) State.garminRows = parseGarmin(await res.json());
  } catch (e) {}
  try {
    const res = await fetch(STRAVA_URL + '?_=' + Date.now());
    if (res.ok) State.stravaData = await res.json();
  } catch (e) {}
  render();
}

function stravaWeeklyKm() {
  if (!State.stravaData || !State.stravaData.activities) return null;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 7);
  const km = State.stravaData.activities
    .filter(a => a.date && new Date(a.date) >= cutoff)
    .reduce((sum, a) => sum + (a.distance_km || 0), 0);
  return Math.round(km * 10) / 10;
}

/* ===================== Avledet data / regel-coach ===================== */
// Viser hvor gammel siste måling faktisk er, i stedet for et hardkodet
// "i dag" — ellers ser en flere uker gammel Withings-måling misvisende ut
// som om den er fersk, hvis synkroniseringen har stått stille en periode.
function relativeDayLabel(dateStr) {
  if (!dateStr) return '';
  const days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(dateStr).setHours(0, 0, 0, 0)) / 86400000);
  if (days <= 0) return 'i dag';
  if (days === 1) return 'i går';
  if (days < 14) return `for ${days} dager siden`;
  const d = new Date(dateStr);
  return d.toLocaleDateString('no-NO', { day: 'numeric', month: 'short' });
}
function latestWithings() { return State.withingsRows[State.withingsRows.length - 1] || null; }
function prevWithings() { return State.withingsRows[State.withingsRows.length - 2] || null; }
function latestGarmin() { return State.garminRows[State.garminRows.length - 1] || null; }

function effectiveRecovery() {
  const g = latestGarmin();
  const m = State.manual;
  return {
    hrv: m.hrvManual ? m.hrv : (g && g.hrvLastNight != null ? g.hrvLastNight : m.hrv),
    hrvManual: m.hrvManual || !(g && g.hrvLastNight != null),
    sleep: m.sleepManual ? m.sleep : (g && g.sleepHours != null ? g.sleepHours : m.sleep),
    sleepManual: m.sleepManual || !(g && g.sleepHours != null),
    bodyBattery: m.bbManual ? m.bodyBattery : (g && g.bodyBattery != null ? g.bodyBattery : m.bodyBattery),
    bbManual: m.bbManual || !(g && g.bodyBattery != null),
  };
}

function computeScore() {
  const w = latestWithings(), pw = prevWithings();
  const rec = effectiveRecovery();
  let score = 70;
  if (rec.sleep != null) score += clamp((rec.sleep - 6) * 5, -15, 15);
  const g = latestGarmin();
  if (g && g.restingHeartRate != null) score += clamp((60 - g.restingHeartRate) * 0.5, -10, 10);
  if (w && pw && w.weight != null && pw.weight != null) score += clamp((pw.weight - w.weight) * 3, -10, 10);
  return Math.round(clamp(score, 0, 100));
}

function trendArrow(curr, prev, higherIsBetter) {
  if (curr == null || prev == null) return { text: '—', color: 'var(--neutral)' };
  const delta = curr - prev;
  if (Math.abs(delta) < 0.05) return { text: '— stabil', color: 'var(--neutral)' };
  const good = higherIsBetter ? delta > 0 : delta < 0;
  const arrow = delta > 0 ? '▲' : '▼';
  return { text: `${arrow} ${Math.abs(delta).toFixed(1)}`, color: good ? 'var(--good)' : 'var(--bad)' };
}

function coachTips() {
  const tips = [];
  const rec = effectiveRecovery();
  const m = State.manual;
  const w = latestWithings();

  if (rec.sleep != null && rec.sleep < 6.5) {
    tips.push('Du har sovet under 6,5 timer — prioriter en tidligere kveld i dag, restitusjonen henger etter.');
  } else if (rec.sleep != null) {
    tips.push(`${fmt1(rec.sleep)} timer søvn er solid — bra grunnlag for dagens økt.`);
  }

  const hours = parseFloat(fastingHours(m.fastingStart, m.fastingEnd));
  if (hours > 10) {
    tips.push(`Spisevinduet ditt er ${hours} timer — vurder å stramme det inn mot 8 timer for 16/8.`);
  } else {
    tips.push(`Spisevindu på ${hours} timer — godt innenfor 16/8-målet.`);
  }

  const uncheckedMeals = Object.entries(m.meals).filter(([, v]) => !v).map(([k]) => MEAL_LABELS[k]);
  if (uncheckedMeals.length > 0) {
    tips.push(`Du mangler foreløpig: ${uncheckedMeals.join(', ')} — se om noe av det passer inn i dag.`);
  } else {
    tips.push('Alle middelhavs-punktene er avkrysset i dag — bra jobba.');
  }

  if (w) {
    tips.push(`Siste vekt logget: ${fmt1(w.weight)} kg, ${fmt1(w.fat_ratio)}% fett.`);
  }

  return tips;
}

const STRENGTH_TYPES = ['Workout', 'Crossfit', 'WeightTraining'];
const CARDIO_TYPES = ['Run', 'Ride', 'VirtualRide', 'Walk', 'Swim', 'Hike'];

function daysSinceActivity(types) {
  const activities = (State.stravaData && State.stravaData.activities) || [];
  const matches = activities.filter(a => types.includes(a.type) && a.date);
  if (!matches.length) return null;
  const latest = matches.reduce((a, b) => (a.date > b.date ? a : b));
  return Math.round((new Date() - new Date(latest.date)) / 86400000);
}

function trainingThisWeekHours() {
  const activities = (State.stravaData && State.stravaData.activities) || [];
  const today = new Date();
  const dow = today.getDay() === 0 ? 7 : today.getDay();
  const weekStart = new Date(today); weekStart.setDate(today.getDate() - dow + 1); weekStart.setHours(0, 0, 0, 0);
  return activities
    .filter(a => a.date && new Date(a.date) >= weekStart)
    .reduce((sum, a) => sum + (a.duration_min || 0) / 60, 0);
}

function computeTrainingRecommendation() {
  const rec = effectiveRecovery();
  const g = latestGarmin();
  const daysSinceStrength = daysSinceActivity(STRENGTH_TYPES);
  const daysSinceCardio = daysSinceActivity(CARDIO_TYPES);
  const thisWeekHours = trainingThisWeekHours();

  let recoveryLow = false;
  if (rec.sleep != null && rec.sleep < 6) recoveryLow = true;
  if (g && g.restingHeartRate != null && g.restingHeartRate > 65) recoveryLow = true;
  if (rec.bodyBattery != null && rec.bodyBattery < 40) recoveryLow = true;
  // HRV vurderes mot ditt eget snitt, ikke en generisk grense (HRV varierer for mye person til person)
  const hrvHistory = State.garminRows.map(r => r.hrvLastNight).filter(v => v != null);
  if (rec.hrv != null && hrvHistory.length >= 3) {
    const baseline = hrvHistory.reduce((a, b) => a + b, 0) / hrvHistory.length;
    if (rec.hrv < baseline * 0.85) recoveryLow = true;
  }

  let sessionType, intensity, reason;
  if (recoveryLow) {
    sessionType = 'Aktiv hvile / lett kondisjon';
    intensity = 'Lav';
    reason = 'Restitusjonstallene (søvn, hvilepuls eller Body Battery) er svakere enn normalt — kroppen trenger et lettere program i dag.';
  } else if (daysSinceStrength == null || daysSinceStrength >= 3) {
    sessionType = 'Styrke';
    intensity = thisWeekHours < 2 ? 'Moderat til høy' : 'Moderat';
    reason = daysSinceStrength == null ? 'Ingen styrkeøkt registrert ennå — bra dag å starte.' : `${daysSinceStrength} dager siden siste styrkeøkt.`;
  } else if (daysSinceCardio == null || daysSinceCardio >= 3) {
    sessionType = 'Kondisjon';
    intensity = 'Moderat';
    reason = daysSinceCardio == null ? 'Ingen kondisjonsøkt registrert ennå.' : `${daysSinceCardio} dager siden siste kondisjonsøkt.`;
  } else if (thisWeekHours < 1.5) {
    sessionType = 'Styrke eller kondisjon';
    intensity = 'Moderat';
    reason = `Bare ${fmt1(thisWeekHours)} treningstimer denne uken foreløpig — god kapasitet til en økt til.`;
  } else {
    sessionType = 'Aktiv hvile';
    intensity = 'Lav';
    reason = `${fmt1(thisWeekHours)} timer logget denne uken allerede — en rolig dag passer fint.`;
  }
  return { sessionType, intensity, reason, thisWeekHours: fmt1(thisWeekHours) };
}

function computeFoodFeedback() {
  const m = State.manual;
  const hours = parseFloat(fastingHours(m.fastingStart, m.fastingEnd));
  const checkedCount = Object.values(m.meals).filter(Boolean).length;
  const missing = Object.entries(m.meals).filter(([, v]) => !v).map(([k]) => MEAL_LABELS[k]);
  const notes = [];
  if (hours > 10) notes.push(`Spisevinduet på ${hours} timer er lengre enn 16/8-målet — vurder å stramme inn mot 8 timer.`);
  else notes.push(`Spisevindu på ${hours} timer er godt innenfor 16/8.`);
  if (checkedCount <= 2) notes.push(`Kun ${checkedCount} av 5 middelhavspunkter avkrysset — prioriter ${missing.slice(0, 2).join(' og ')} i dag.`);
  else if (missing.length) notes.push(`Nesten i mål — mangler bare ${missing.join(', ')}.`);
  else notes.push('Alle middelhavspunktene er dekket i dag — solid.');
  return notes;
}

function computeIdealWeight() {
  const w = latestWithings();
  if (!w || w.fat_ratio == null || w.weight == null) return null;
  const fatFreeMass = w.weight * (1 - w.fat_ratio / 100);
  const targetPct = State.manual.targetFatPercent;
  const idealWeight = fatFreeMass / (1 - targetPct / 100);
  return { idealWeight, fatFreeMass, targetPct, diff: w.weight - idealWeight };
}
function setTargetFat(value) {
  const num = Number(value);
  if (!isNaN(num) && num > 0 && num < 60) State.manual.targetFatPercent = num;
  saveManual(); render();
}

// Slår sammen vekt, restitusjon, trening og kosthold til ÉN samlet
// PT-vurdering, i stedet for spredte enkeltkort — dette er nærmest en
// regelbasert motor kommer en helhetlig morgenbriefing.
function computeTotalAssessment() {
  const w = latestWithings(), pw = prevWithings();
  const rec = effectiveRecovery();
  const g = latestGarmin();
  const training = computeTrainingRecommendation();
  const food = computeFoodFeedback();
  const ideal = computeIdealWeight();

  let weightLine;
  if (w) {
    weightLine = `${fmt1(w.weight)} kg, ${fmt1(w.fat_ratio)}% fett (mål ${State.manual.targetFatPercent}%) — målt ${relativeDayLabel(w.date)}.`;
    if (pw && pw.weight != null && Math.abs(w.weight - pw.weight) >= 0.1) {
      const delta = w.weight - pw.weight;
      weightLine += ` ${delta < 0 ? 'Ned' : 'Opp'} ${Math.abs(delta).toFixed(1)} kg siden forrige måling.`;
    }
    if (ideal) {
      weightLine += ` ${fmt1(Math.abs(ideal.diff))} kg ${ideal.diff > 0 ? 'over' : 'under'} idealvekt ved ${ideal.targetPct}% fett.`;
    }
  } else {
    weightLine = 'Ingen vektdata registrert ennå.';
  }

  const recBits = [];
  if (rec.sleep != null) recBits.push(`${fmt1(rec.sleep)} t søvn`);
  if (g && g.restingHeartRate != null) recBits.push(`${Math.round(g.restingHeartRate)} bpm hvilepuls`);
  if (rec.bodyBattery != null) recBits.push(`Body Battery ${Math.round(rec.bodyBattery)}`);
  const recoveryLine = recBits.length ? recBits.join(', ') + '.' : 'Ingen restitusjonsdata registrert ennå.';

  const trainingLine = `${training.sessionType}, ${training.intensity.toLowerCase()} intensitet — ${training.reason} (${training.thisWeekHours} t denne uken).`;
  const foodLine = food.join(' ');

  return [
    { label: 'Vekt', text: weightLine },
    { label: 'Restitusjon', text: recoveryLine },
    { label: 'Trening', text: trainingLine },
    { label: 'Kosthold', text: foodLine },
  ];
}

function dailyFocus() {
  const rec = effectiveRecovery();
  if (rec.sleep != null && rec.sleep < 6.5) return { label: 'Restitusjon', text: 'Lite søvn i natt — prioriter hvile og lett bevegelse i dag.' };
  const g = latestGarmin();
  if (g && g.restingHeartRate != null && g.restingHeartRate > 62) return { label: 'Restitusjon', text: 'Hvilepulsen er høyere enn vanlig — vurder en roligere dag.' };
  return { label: 'Trening', text: 'Tallene ser greie ut — god dag for en kvalitetsøkt.' };
}

// Faste spørsmål coachen faktisk klarer å svare presist på — vises som
// trykkbare chips i stedet for fritekst, siden et fritekstfelt lover mer
// enn en regelbasert motor kan holde (den skjønner kun disse fire temaene).
const COACH_PROMPTS = [
  { label: 'Søvn', query: 'Hvordan var søvnen min?' },
  { label: 'Vekt', query: 'Hva veier jeg nå?' },
  { label: 'Hvilepuls', query: 'Hva er hvilepulsen min?' },
  { label: 'Kosthold', query: 'Hva bør jeg spise i dag?' },
];
function coachReply(userText) {
  const t = userText.toLowerCase();
  const rec = effectiveRecovery();
  if (t.includes('søvn') || t.includes('sove')) {
    return rec.sleep != null ? `Du sov ${fmt1(rec.sleep)} timer sist registrert.` : 'Ingen søvndata registrert ennå — legg inn tall under Kropp-fanen.';
  }
  if (t.includes('mat') || t.includes('kosthold') || t.includes('spis')) {
    return coachTips().find(t => t.includes('middelhavs') || t.includes('mangler')) || 'Sjekk Kost-fanen for dagens middelhavssjekkliste.';
  }
  if (t.includes('vekt') || t.includes('kilo')) {
    const w = latestWithings();
    return w ? `Siste vekt: ${fmt1(w.weight)} kg, ${fmt1(w.fat_ratio)}% fett.` : 'Ingen vektdata funnet ennå.';
  }
  if (t.includes('puls') || t.includes('hvilepuls')) {
    const g = latestGarmin();
    return g && g.restingHeartRate ? `Hvilepuls sist målt: ${Math.round(g.restingHeartRate)} bpm.` : 'Ingen pulsdata funnet ennå.';
  }
  return 'Notert! Denne coachen er regelbasert (ikke fri KI-samtale ennå) — spør gjerne om søvn, vekt, puls eller kosthold, så svarer jeg med dine egne tall.';
}

  const side = State.manual.silhouetteSide;

function pickPhoto(ctx) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      State.manual.photos[State.manual.silhouetteSide] = reader.result;
      saveManual(); render();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

    <div class="card tight col gap8">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Notater om dagens måltider</div>
      <textarea oninput="setNotes(this.value)" placeholder="F.eks. frokost: gresk yoghurt med bær og valnøtter…" style="padding:10px 12px;font-size:13px;min-height:64px;resize:none">${esc(m.nutritionNotes)}</textarea>
    </div>

    <div class="teaser col gap8">
      <div style="font-size:12px;font-weight:600;color:var(--accent)">Coach om kosthold</div>
      ${tips.map(t => `<div style="font-size:11.5px;color:var(--muted-8);line-height:1.4">• ${esc(t)}</div>`).join('')}
    </div>
  `;
}
function setFasting(which, value) {
  if (which === 'start') State.manual.fastingStart = value; else State.manual.fastingEnd = value;
  saveManual(); render();
}
function toggleMeal(key) { State.manual.meals[key] = !State.manual.meals[key]; saveManual(); render(); }
function setNotes(value) { State.manual.nutritionNotes = value; saveManual(); }

/* ===================== Status-sammendrag til Claude-chat ===================== */
function buildStatusSummary() {
  const w = latestWithings(), pw = prevWithings();
  const rec = effectiveRecovery();
  const g = latestGarmin();
  const km7 = stravaWeeklyKm();
  const activities = (State.stravaData && State.stravaData.activities) || [];
  const recentActs = activities.slice(0, 5);
  const m = State.manual;
  const hours = fastingHours(m.fastingStart, m.fastingEnd);
  const mealsChecked = Object.entries(m.meals).filter(([, v]) => v).map(([k]) => MEAL_LABELS[k]);
  const mealsMissing = Object.entries(m.meals).filter(([, v]) => !v).map(([k]) => MEAL_LABELS[k]);

  const lines = [];
  lines.push(`PT-status ${new Date().toLocaleDateString('no-NO')}`);
  lines.push('');
  lines.push('KROPP (Withings)');
  if (w) {
    lines.push(`Vekt: ${fmt1(w.weight)} kg${pw && pw.weight != null ? ` (forrige måling: ${fmt1(pw.weight)} kg)` : ''}`);
    if (w.fat_ratio != null && w.fat_mass != null) lines.push(`Fettmasse: ${fmt1(w.fat_mass)} kg (${fmt1(w.fat_ratio)}%)`);
    if (w.muscle_mass != null) lines.push(`Muskelmasse: ${fmt1(w.muscle_mass)} kg (${fmt1(w.muscle_mass / w.weight * 100)}%)`);
    if (w.bone_mass != null) lines.push(`Beinbygning: ${fmt1(w.bone_mass)} kg (${fmt1(w.bone_mass / w.weight * 100)}%)`);
    if (w.bmi != null) lines.push(`BMI: ${fmt1(w.bmi)}`);
    const ideal = computeIdealWeight();
    if (ideal) lines.push(`Idealvekt ved ${ideal.targetPct}% fett (samme muskelmasse): ${fmt1(ideal.idealWeight)} kg — ${ideal.diff > 0 ? fmt1(ideal.diff) + ' kg å gå ned' : fmt1(Math.abs(ideal.diff)) + ' kg under allerede'}`);
  } else {
    lines.push('Ingen vektdata funnet ennå.');
  }
  lines.push('');
  lines.push('RESTITUSJON (Garmin / manuelt)');
  lines.push(`HRV: ${rec.hrv ?? '–'} ms (${rec.hrvManual ? 'manuelt' : 'Garmin'})`);
  lines.push(`Søvn: ${rec.sleep ?? '–'} t (${rec.sleepManual ? 'manuelt' : 'Garmin'})`);
  lines.push(`Body Battery: ${rec.bodyBattery ?? '–'} % (${rec.bbManual ? 'manuelt' : 'Garmin'})`);
  if (g && g.restingHeartRate != null) lines.push(`Hvilepuls: ${Math.round(g.restingHeartRate)} bpm`);
  lines.push('');
  lines.push('TRENING (Strava)');
  lines.push(`Siste 7 dager: ${km7 != null ? km7 + ' km' : 'ingen data'}`);
  if (recentActs.length) {
    lines.push('Siste økter:');
    recentActs.forEach(a => {
      const details = [
        a.duration_min ? Math.round(a.duration_min) + ' min' : null,
        a.distance_km ? fmt1(a.distance_km) + ' km' : null,
        a.avg_hr ? Math.round(a.avg_hr) + ' bpm' : null,
      ].filter(Boolean).join(', ');
      lines.push(`- ${a.date}: ${STRAVA_TYPE_LABELS[a.type] || a.type}${details ? ' (' + details + ')' : ''}`);
    });
  } else {
    lines.push('Ingen treningsøkter hentet ennå.');
  }
  lines.push('');
  lines.push('KOSTHOLD');
  lines.push(`Spisevindu: ${m.fastingStart}–${m.fastingEnd} (${hours} t)`);
  lines.push(`Avkrysset i dag: ${mealsChecked.length ? mealsChecked.join(', ') : 'ingen ennå'}`);
  if (mealsMissing.length) lines.push(`Mangler: ${mealsMissing.join(', ')}`);
  if (m.nutritionNotes) lines.push(`Notater: ${m.nutritionNotes}`);
  lines.push('');
  const training = computeTrainingRecommendation();
  lines.push('APPENS TRENINGSFORSLAG (enkel regelbasert vurdering)');
  lines.push(`${training.sessionType}, ${training.intensity} intensitet — ${training.reason}`);
  lines.push('');
  lines.push('APPENS KOSTHOLDSVURDERING');
  computeFoodFeedback().forEach(t => lines.push(`- ${t}`));
  lines.push('');
  lines.push('Bruk disse tallene til å hjelpe meg videre som PT — målet er ned i fettprosent og opp i styrke og kondis.');

  return lines.join('\n');
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}
function copyStatusSummary() {
  const text = buildStatusSummary();
  const btn = document.getElementById('copyStatusBtn');
  const showDone = () => { if (btn) { btn.textContent = 'Kopiert! Lim inn i en chat med Claude.'; setTimeout(() => { if (btn) btn.textContent = 'Kopier status til Claude-chat'; }, 2200); } };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(showDone).catch(() => fallbackCopy(text, showDone));
  } else {
    fallbackCopy(text, showDone);
  }
}

/* ===================== Render: Coach ===================== */
function renderCoach() {
  const focus = dailyFocus();
  const assessment = computeTotalAssessment();
  const messages = State.manual.chatMessages;
  return `
    <h1 class="title" style="margin-bottom:2px">Coach</h1>
    <div class="teaser col gap4">
      <div style="font-size:12px;font-weight:600;color:var(--accent)">Dagens fokus: ${esc(focus.label)}</div>
      <div style="font-size:11.5px;color:var(--muted-75);line-height:1.4">${esc(focus.text)}</div>
    </div>
    <div class="card tight col gap8">
      <div style="font-size:12.5px;font-weight:600">PT-vurdering i dag</div>
      ${assessment.map(a => `
        <div class="col gap2">
          <div style="font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:0.03em">${esc(a.label)}</div>
          <div style="font-size:11.5px;color:var(--muted-75);line-height:1.4">${esc(a.text)}</div>
        </div>`).join('')}
    </div>
    <div class="col gap6" style="align-items:center">
      <div id="copyStatusBtn" onclick="copyStatusSummary()" style="cursor:pointer;background:var(--accent);color:#121212;font-size:12.5px;font-weight:700;padding:10px 18px;border-radius:999px;text-align:center">Kopier status til Claude-chat</div>
      <div style="font-size:10px;color:var(--muted-5);text-align:center;line-height:1.4">Kopierer vekt, restitusjon, trening og kosthold som tekst — lim inn i en samtale med Claude for ekte PT-råd, gratis, ingen egen KI-nøkkel trengs.</div>
    </div>
    <div class="chat-thread" id="chatThread">
      ${messages.map(m => `
        <div class="row" style="justify-content:${m.from === 'coach' ? 'flex-start' : 'flex-end'}">
          <div class="chat-bubble" style="background:${m.from === 'coach' ? 'var(--card)' : 'var(--accent)'};color:${m.from === 'coach' ? 'var(--text)' : '#121212'}">${esc(m.text)}</div>
        </div>`).join('')}
    </div>
    <div class="row gap6" style="flex-wrap:wrap">
      ${COACH_PROMPTS.map((p, i) => `<div onclick="askCoach(${i})" style="cursor:pointer;background:var(--card);color:var(--text);font-size:12px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--muted-4)">${esc(p.label)}</div>`).join('')}
    </div>
    <div style="font-size:10px;color:var(--muted-4);text-align:center">Regelbasert coach — svarer kun på disse faste spørsmålene med dine egne tall. For alt annet: bruk "Kopier status til Claude-chat".</div>
  `;
}
function askCoach(i) {
  const prompt = COACH_PROMPTS[i];
  if (!prompt) return;
  State.manual.chatMessages.push({ from: 'user', text: prompt.query });
  let reply;
  try {
    reply = coachReply(prompt.query);
  } catch (e) {
    reply = 'Beklager, den enkle regelmotoren snublet på det spørsmålet. Bruk "Kopier status til Claude-chat" for et bedre svar.';
  }
  State.manual.chatMessages.push({ from: 'coach', text: reply });
  saveManual(); render();
  setTimeout(() => {
    const thread = document.getElementById('chatThread');
    if (thread) thread.scrollTop = thread.scrollHeight;
  }, 0);
}

/* ===================== Tab-bar ikoner ===================== */
function tabIcon(i, active) {
  const c = active ? 'var(--accent)' : 'var(--muted-4)';
  const icons = [
    `<div style="width:16px;height:16px;border-radius:4px;background:${c}"></div>`,
    `<div style="width:16px;height:16px;border-radius:50%;background:${c}"></div>`,
    `<div class="col gap2" style="height:16px;justify-content:center;gap:2px">
       <div style="width:16px;height:2.5px;border-radius:1px;background:${c}"></div>
       <div style="width:16px;height:2.5px;border-radius:1px;background:${c}"></div>
       <div style="width:16px;height:2.5px;border-radius:1px;background:${c}"></div>
     </div>`,
    `<div class="row gap2" style="align-items:flex-end;height:16px">
       <div style="width:4px;height:7px;background:${c}"></div>
       <div style="width:4px;height:11px;background:${c}"></div>
       <div style="width:4px;height:16px;background:${c}"></div>
     </div>`,
    `<div style="width:16px;height:16px;border-radius:50%;border:2.5px solid ${c};box-sizing:border-box"></div>`,
    `<div style="width:14px;height:14px;background:${c};transform:rotate(45deg)"></div>`,
  ];
  return icons[i];
}
function renderTabBar() {
  document.getElementById('tabBar').innerHTML = TABS.map((label, i) => `
    <div class="tab-btn" onclick="goTab(${i})">
      ${tabIcon(i, State.tab === i)}
      <div class="label" style="color:${State.tab === i ? 'var(--accent)' : 'var(--muted-4)'}">${label}</div>
    </div>`).join('');
}
function goTab(i) { State.tab = i; render(); }

/* ===================== Master render ===================== */
function render() {
  const renderers = [renderHome, renderBody, renderLog, renderProgress, renderNutrition, renderCoach];
  document.getElementById('content').innerHTML = renderers[State.tab]();
  renderTabBar();
  if (State.tab === 3) {
    document.getElementById('chart-weight').innerHTML = svgLine(State.withingsRows.map(r => r.weight), getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c8ff3d', 320, 70);
    document.getElementById('chart-fat').innerHTML = svgLine(State.withingsRows.map(r => r.fat_ratio).filter(v => v != null), getComputedStyle(document.documentElement).getPropertyValue('--orange').trim(), 320, 70);
    const weeklyHours = State.stravaData && State.stravaData.weekly_hours ? State.stravaData.weekly_hours.map(w => w.hours) : [];
    document.getElementById('chart-volume').innerHTML = weeklyHours.some(h => h > 0)
      ? svgBar(weeklyHours, getComputedStyle(document.documentElement).getPropertyValue('--blue').trim(), 320, 70, 'rgba(56,189,255,.35)')
      : '<div class="empty-state">Ingen Strava-økter hentet ennå.</div>';
  }
}

/* ===================== Bootstrap ===================== */
render();
loadData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
