<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Ørjan — Treningsapp</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT">
<link rel="icon" href="pwa-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="pwa-icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --card-input: #161616;
    --teaser: #2a2a1a;
    --text: #f4f3f1;
    --muted-4: rgba(244,243,241,.4);
    --muted-5: rgba(244,243,241,.5);
    --muted-55: rgba(244,243,241,.55);
    --muted-6: rgba(244,243,241,.6);
    --muted-75: rgba(244,243,241,.75);
    --muted-8: rgba(244,243,241,.8);
    --accent: #c8ff3d;
    --orange: oklch(78% 0.19 50);
    --blue: oklch(78% 0.16 250);
    --violet: oklch(75% 0.18 310);
    --good: #8ee66b;
    --bad: oklch(68% 0.19 25);
    --neutral: rgba(244,243,241,.5);
    --strava: #fc5200;
    --garmin: #0077c8;
    --withings: #9ca3af;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 12px;
  }
  #device {
    width: 100%;
    max-width: 420px;
    min-height: 780px;
    background: var(--bg);
    border-radius: 36px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.06);
  }
  #content {
    flex: 1;
    overflow: auto;
    padding: 22px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1.title { font-size: 22px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .greeting-date { font-size: 13px; color: var(--muted-55); font-weight: 500; }
  .greeting-hi { font-size: 24px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }

  .card { background: var(--card); border-radius: 20px; padding: 18px 20px; }
  .card.tight { padding: 16px; }
  .card.list-item { padding: 14px 16px; border-radius: 16px; }
  .teaser { background: var(--teaser); border-radius: 20px; padding: 14px 16px; }

  .row { display: flex; align-items: center; }
  .col { display: flex; flex-direction: column; }
  .gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; }
  .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap16 { gap: 16px; }

  .stat-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .source-card { background: var(--card); border-radius: 16px; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .source-card .dot { width: 8px; height: 8px; border-radius: 50%; }
  .source-card .metric { font-size: 14px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .source-card .label { font-size: 9.5px; color: var(--muted-55); }

  .silhouette { border-radius: 14px; background: var(--card); position: relative; flex: none; overflow: hidden; cursor: pointer; }
  .silhouette img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .silhouette .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 9px; color: var(--muted-4); padding: 6px; }

  .toggle-row { display: flex; gap: 8px; font-size: 9.5px; font-weight: 600; }
  .toggle-row span { cursor: pointer; }

  input[type="number"], input[type="time"], input[type="text"], textarea {
    background: var(--card-input);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    outline: none;
  }

  .tab-bar { flex: none; display: flex; padding: 8px 8px 4px; gap: 2px; border-top: 1px solid rgba(255,255,255,.06); background: var(--bg); }
  .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0; cursor: pointer; }
  .tab-btn .label { font-size: 9.5px; font-weight: 600; }

  .chat-bubble { max-width: 78%; border-radius: 14px; padding: 9px 13px; font-size: 13px; line-height: 1.4; }
  .chat-thread { flex: 1; display: flex; flex-direction: column; gap: 10px; overflow: auto; min-height: 200px; max-height: 340px; }

  .meal-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .meal-box { width: 18px; height: 18px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #121212; font-weight: 700; }

  .empty-state { font-size: 12px; color: var(--muted-5); line-height: 1.5; padding: 6px 2px; }
  .badge { font-size: 9px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted-6); font-weight: 600; }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="device">
  <div id="content"></div>
  <div class="tab-bar" id="tabBar"></div>
</div>

<script>
/* ===================== Konstanter / design-tokens ===================== */
const ACCENT = 'var(--accent)';
const TABS = ['Hjem', 'Kropp', 'Logg', 'Fremgang', 'Kost', 'Coach'];
const WITHINGS_URL = 'data.json';
const GARMIN_URL = 'garmin_health.json';
const STORAGE_KEY = 'pt-app-state-v1';

const MEAL_LABELS = {
  vegetables: 'Rikelig grønnsaker', fish: 'Fisk / sjømat', oliveOil: 'Olivenolje som fettkilde',
  wholegrain: 'Fullkorn', nuts: 'Nøtter / frø',
};

/* ===================== State ===================== */
const State = {
  tab: 0,
  withingsRows: [],
  garminRows: [],
  manual: loadManual(),
};

function loadManual() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(defaultManual(), JSON.parse(raw));
  } catch (e) {}
  return defaultManual();
}
function defaultManual() {
  return {
    hrv: null, hrvManual: false,
    sleep: null, sleepManual: false,
    bodyBattery: null, bbManual: false,
    silhouetteSide: 'front',
    photos: { front: null, back: null },
    fastingStart: '12:00', fastingEnd: '20:00',
    nutritionNotes: '',
    meals: { vegetables: false, fish: false, oliveOil: false, wholegrain: false, nuts: false },
    chatMessages: [
      { from: 'coach', text: 'Hei! Jeg er coachen din — spør meg om trening, søvn eller kosthold, basert på dine egne tall.' }
    ],
  };
}
function saveManual() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(State.manual)); } catch (e) {}
}

/* ===================== Hjelpefunksjoner ===================== */
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function fmt1(v) { return (v == null || isNaN(v)) ? null : Math.round(v * 10) / 10; }
function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fastingHours(start, end) {
  const [sh, sm] = start.split(':').map(Number), [eh, em] = end.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60;
  return (mins / 60).toFixed(1).replace(/\.0$/, '');
}

function svgLine(data, color, w, h) {
  if (!data || data.length < 2) return `<div class="empty-state">Ikke nok datapunkter ennå.</div>`;
  const min = Math.min(...data), max = Math.max(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * (w - 8) + 4;
    const y = h - 6 - ((v - min) / (max - min || 1)) * (h - 12);
    return [x, y];
  });
  const points = pts.map(p => p.join(',')).join(' ');
  const last = pts[pts.length - 1];
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${color}"/>
  </svg>`;
}
function svgMultiLine(series, w, h) {
  const usable = series.filter(s => s.data && s.data.length >= 2);
  if (usable.length === 0) return `<div class="empty-state">Ikke nok datapunkter ennå — trenden vokser etter hvert som flere dager logges.</div>`;
  const parts = usable.map(s => {
    const min = Math.min(...s.data), max = Math.max(...s.data);
    const pts = s.data.map((v, i) => {
      const x = (i / (s.data.length - 1)) * (w - 8) + 4;
      const y = h - 6 - ((v - min) / (max - min || 1)) * (h - 12);
      return [x, y];
    });
    const last = pts[pts.length - 1];
    return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${s.color}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${parts}</svg>`;
}
function svgBar(data, color, w, h, dimColor) {
  if (!data || data.length === 0) return `<div class="empty-state">Ingen data ennå.</div>`;
  const max = Math.max(...data) || 1;
  const bw = (w / data.length) * 0.55;
  const gap = (w / data.length) - bw;
  const bars = data.map((v, i) => {
    const bh = (v / max) * (h - 8);
    const x = i * (bw + gap) + gap / 2;
    const fill = i === data.length - 1 ? color : (dimColor || color);
    return `<rect x="${x}" y="${h - bh}" width="${bw}" height="${bh}" rx="3" fill="${fill}"/>`;
  }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">${bars}</svg>`;
}

/* ===================== Datahenting ===================== */
function classifyWithings(fieldName) {
  const n = fieldName.toLowerCase();
  if (n.includes('fat') && n.includes('ratio')) return 'fat_ratio';
  if (n.includes('fat') && (n.includes('mass') || n.includes('weight'))) return 'fat_mass';
  if (n.includes('muscle')) return 'muscle_mass';
  if (n.includes('bone')) return 'bone_mass';
  if (n.includes('bmi')) return 'bmi';
  if (n.includes('weight') && !n.includes('fat')) return 'weight';
  return null;
}
function parseWithings(raw) {
  const rows = [];
  if (!raw || typeof raw !== 'object') return rows;
  for (const [dtStr, fields] of Object.entries(raw)) {
    if (!fields || typeof fields !== 'object') continue;
    const row = { date: dtStr.slice(0, 10), _dt: dtStr };
    for (const [fieldName, obj] of Object.entries(fields)) {
      if (!obj || typeof obj !== 'object' || obj.Value == null) continue;
      const key = classifyWithings(fieldName);
      if (key) row[key] = obj.Value;
    }
    if (row.weight !== undefined) rows.push(row);
  }
  return rows.sort((a, b) => a._dt.localeCompare(b._dt));
}

function extractGarminDay(entry) {
  const out = {};
  if (!entry) return out;
  if (entry.stats) {
    out.restingHeartRate = entry.stats.restingHeartRate ?? entry.stats.restingHeartRateInBeatsPerMinute ?? null;
    out.bodyBattery = entry.stats.bodyBatteryMostRecentValue ?? entry.stats.mostRecentBodyBattery ?? null;
  }
  if (entry.sleep) {
    const dto = entry.sleep.dailySleepDTO || entry.sleep;
    const totalSec = dto && dto.sleepTimeSeconds;
    if (totalSec) out.sleepHours = totalSec / 3600;
  }
  if (entry.hrv) {
    const summary = entry.hrv.hrvSummary || entry.hrv;
    out.hrvLastNight = summary ? (summary.lastNightAvg ?? summary.lastNight5MinHigh ?? null) : null;
  }
  return out;
}
function parseGarmin(json) {
  const rows = [];
  if (!json || typeof json !== 'object') return rows;
  for (const [date, entry] of Object.entries(json)) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    rows.push({ date, ...extractGarminDay(entry) });
  }
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

async function loadData() {
  try {
    const res = await fetch(WITHINGS_URL + '?_=' + Date.now());
    if (res.ok) State.withingsRows = parseWithings(await res.json());
  } catch (e) {}
  try {
    const res = await fetch(GARMIN_URL + '?_=' + Date.now());
    if (res.ok) State.garminRows = parseGarmin(await res.json());
  } catch (e) {}
  render();
}

/* ===================== Avledet data / regel-coach ===================== */
function latestWithings() { return State.withingsRows[State.withingsRows.length - 1] || null; }
function prevWithings() { return State.withingsRows[State.withingsRows.length - 2] || null; }
function latestGarmin() { return State.garminRows[State.garminRows.length - 1] || null; }

function effectiveRecovery() {
  const g = latestGarmin();
  const m = State.manual;
  return {
    hrv: m.hrvManual ? m.hrv : (g && g.hrvLastNight != null ? g.hrvLastNight : m.hrv),
    hrvManual: m.hrvManual || !(g && g.hrvLastNight != null),
    sleep: m.sleepManual ? m.sleep : (g && g.sleepHours != null ? g.sleepHours : m.sleep),
    sleepManual: m.sleepManual || !(g && g.sleepHours != null),
    bodyBattery: m.bbManual ? m.bodyBattery : (g && g.bodyBattery != null ? g.bodyBattery : m.bodyBattery),
    bbManual: m.bbManual || !(g && g.bodyBattery != null),
  };
}

function computeScore() {
  const w = latestWithings(), pw = prevWithings();
  const rec = effectiveRecovery();
  let score = 70;
  if (rec.sleep != null) score += clamp((rec.sleep - 6) * 5, -15, 15);
  const g = latestGarmin();
  if (g && g.restingHeartRate != null) score += clamp((60 - g.restingHeartRate) * 0.5, -10, 10);
  if (w && pw && w.weight != null && pw.weight != null) score += clamp((pw.weight - w.weight) * 3, -10, 10);
  return Math.round(clamp(score, 0, 100));
}

function trendArrow(curr, prev, higherIsBetter) {
  if (curr == null || prev == null) return { text: '—', color: 'var(--neutral)' };
  const delta = curr - prev;
  if (Math.abs(delta) < 0.05) return { text: '— stabil', color: 'var(--neutral)' };
  const good = higherIsBetter ? delta > 0 : delta < 0;
  const arrow = delta > 0 ? '▲' : '▼';
  return { text: `${arrow} ${Math.abs(delta).toFixed(1)}`, color: good ? 'var(--good)' : 'var(--bad)' };
}

function coachTips() {
  const tips = [];
  const rec = effectiveRecovery();
  const m = State.manual;
  const w = latestWithings();

  if (rec.sleep != null && rec.sleep < 6.5) {
    tips.push('Du har sovet under 6,5 timer — prioriter en tidligere kveld i dag, restitusjonen henger etter.');
  } else if (rec.sleep != null) {
    tips.push(`${fmt1(rec.sleep)} timer søvn er solid — bra grunnlag for dagens økt.`);
  }

  const hours = parseFloat(fastingHours(m.fastingStart, m.fastingEnd));
  if (hours > 10) {
    tips.push(`Spisevinduet ditt er ${hours} timer — vurder å stramme det inn mot 8 timer for 16/8.`);
  } else {
    tips.push(`Spisevindu på ${hours} timer — godt innenfor 16/8-målet.`);
  }

  const uncheckedMeals = Object.entries(m.meals).filter(([, v]) => !v).map(([k]) => MEAL_LABELS[k]);
  if (uncheckedMeals.length > 0) {
    tips.push(`Du mangler foreløpig: ${uncheckedMeals.join(', ')} — se om noe av det passer inn i dag.`);
  } else {
    tips.push('Alle middelhavs-punktene er avkrysset i dag — bra jobba.');
  }

  if (w) {
    tips.push(`Siste vekt logget: ${fmt1(w.weight)} kg, ${fmt1(w.fat_ratio)}% fett.`);
  }

  return tips;
}

function dailyFocus() {
  const rec = effectiveRecovery();
  if (rec.sleep != null && rec.sleep < 6.5) return { label: 'Restitusjon', text: 'Lite søvn i natt — prioriter hvile og lett bevegelse i dag.' };
  const g = latestGarmin();
  if (g && g.restingHeartRate != null && g.restingHeartRate > 62) return { label: 'Restitusjon', text: 'Hvilepulsen er høyere enn vanlig — vurder en roligere dag.' };
  return { label: 'Trening', text: 'Tallene ser greie ut — god dag for en kvalitetsøkt.' };
}

function coachReply(userText) {
  const t = userText.toLowerCase();
  const rec = effectiveRecovery();
  if (t.includes('søvn') || t.includes('sove')) {
    return rec.sleep != null ? `Du sov ${fmt1(rec.sleep)} timer sist registrert.` : 'Ingen søvndata registrert ennå — legg inn tall under Kropp-fanen.';
  }
  if (t.includes('mat') || t.includes('kosthold') || t.includes('spis')) {
    return coachTips().find(t => t.includes('middelhavs') || t.includes('mangler')) || 'Sjekk Kost-fanen for dagens middelhavssjekkliste.';
  }
  if (t.includes('vekt') || t.includes('kilo')) {
    const w = latestWithings();
    return w ? `Siste vekt: ${fmt1(w.weight)} kg, ${fmt1(w.fat_ratio)}% fett.` : 'Ingen vektdata funnet ennå.';
  }
  if (t.includes('puls') || t.includes('hvilepuls')) {
    const g = latestGarmin();
    return g && g.restingHeartRate ? `Hvilepuls sist målt: ${Math.round(g.restingHeartRate)} bpm.` : 'Ingen pulsdata funnet ennå.';
  }
  return 'Notert! Denne coachen er regelbasert (ikke fri KI-samtale ennå) — spør gjerne om søvn, vekt, puls eller kosthold, så svarer jeg med dine egne tall.';
}

/* ===================== Render: Hjem ===================== */
function renderHome() {
  const w = latestWithings();
  const g = latestGarmin();
  const score = computeScore();
  const bodyTransform = w
    ? `scale(${clamp(1 + ((w.fat_ratio ?? 18) - 18) * 0.012, 0.92, 1.1).toFixed(3)}, ${clamp(1 - ((w.muscle_mass ?? 40) - 40) * 0.006, 0.95, 1.05).toFixed(3)})`
    : 'scale(1,1)';
  const focus = dailyFocus();

  const statsMini = [
    { label: 'Fettprosent', value: w && w.fat_ratio != null ? fmt1(w.fat_ratio) + '%' : '–', pct: w ? clamp((w.fat_ratio ?? 0) / 40 * 100, 5, 100) : 0, color: 'var(--orange)' },
    { label: 'Muskelmasse', value: w && w.muscle_mass != null ? fmt1(w.muscle_mass) + ' kg' : '–', pct: w ? clamp((w.muscle_mass ?? 0) / 100 * 100, 5, 100) : 0, color: 'var(--blue)' },
    { label: 'Beinbygning', value: w && w.bone_mass != null ? fmt1(w.bone_mass) + ' kg' : '–', pct: w ? clamp((w.bone_mass ?? 0) / 6 * 100, 5, 100) : 0, color: 'var(--violet)' },
  ];

  const today = new Date().toLocaleDateString('no-NO', { weekday: 'long', day: 'numeric', month: 'long' });

  return `
    <div class="col gap4">
      <div class="greeting-date">${today[0].toUpperCase() + today.slice(1)}</div>
      <div class="greeting-hi">Hei, Ørjan</div>
    </div>

    <div class="card row gap16">
      <div style="width:76px;height:76px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--accent) 0% ${score}%, rgba(255,255,255,.08) ${score}% 100%)">
        <div style="width:60px;height:60px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div style="font-size:20px;font-weight:700;font-family:'Space Grotesk',sans-serif">${score}</div>
          <div style="font-size:8px;color:var(--muted-55);letter-spacing:0.4px">FORM I DAG</div>
        </div>
      </div>
      <div class="col gap4">
        <div style="font-size:14px;font-weight:600">${focus.label === 'Restitusjon' ? 'Prioriter hvile i dag' : 'Bra momentum!'}</div>
        <div style="font-size:12px;color:var(--muted-55);line-height:1.4">${esc(focus.text)}</div>
      </div>
    </div>

    <div class="card tight row gap14">
      ${renderSilhouette(84, 150, bodyTransform, 'home')}
      <div class="col gap10" style="flex:1;justify-content:center">
        ${statsMini.map(s => `
          <div class="col gap4">
            <div class="row" style="justify-content:space-between;font-size:11.5px">
              <span style="color:var(--muted-55)">${s.label}</span>
              <span style="font-weight:600">${s.value}</span>
            </div>
            <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden">
              <div style="height:100%;border-radius:3px;background:${s.color};width:${s.pct}%"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="stat-2x2">
      <div class="source-card"><div class="dot" style="background:var(--strava)"></div><div class="metric">–</div><div class="label">Strava · uke (ikke koblet ennå)</div></div>
      <div class="source-card"><div class="dot" style="background:var(--garmin)"></div><div class="metric">${g && g.restingHeartRate ? Math.round(g.restingHeartRate) + ' bpm' : '–'}</div><div class="label">Garmin · hvilepuls</div></div>
      <div class="source-card"><div class="dot" style="background:var(--withings)"></div><div class="metric">${w ? fmt1(w.weight) + ' kg' : '–'}</div><div class="label">Vekt · i dag</div></div>
      <div class="source-card"><div class="dot" style="background:var(--violet)"></div><div class="metric">${w && w.bmi != null ? fmt1(w.bmi) : '–'}</div><div class="label">Withings · BMI</div></div>
    </div>

    <div class="teaser row gap12" style="align-items:flex-start;cursor:pointer" onclick="goTab(5)">
      <div style="width:34px;height:34px;border-radius:50%;background:rgba(200,255,61,.18);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent)">AI</div>
      <div class="col gap4" style="flex:1">
        <div style="font-size:12.5px;font-weight:600">Dagens anbefaling</div>
        <div style="font-size:11.5px;color:var(--muted-75);line-height:1.4">${esc(coachTips()[0] || '')}</div>
        <div style="font-size:11px;font-weight:600;color:var(--accent);margin-top:2px">Chat med coach →</div>
      </div>
    </div>
  `;
}

function renderSilhouette(w, h, transform, ctx) {
  const side = State.manual.silhouetteSide;
  const photo = State.manual.photos[side];
  const frontColor = side === 'front' ? 'var(--text)' : 'var(--muted-4)';
  const backColor = side === 'back' ? 'var(--text)' : 'var(--muted-4)';
  return `
    <div class="col gap6" style="align-items:center;flex:none">
      <div class="silhouette" style="width:${w}px;height:${h}px;transform:${transform};transform-origin:center bottom" onclick="pickPhoto('${ctx}')">
        ${photo ? `<img src="${photo}">` : `<div class="empty">Trykk for å laste opp kroppsbilde (${side === 'front' ? 'front' : 'bak'})</div>`}
      </div>
      <div class="toggle-row">
        <span style="color:${frontColor}" onclick="event.stopPropagation();setSide('front')">Front</span>
        <span style="color:${backColor}" onclick="event.stopPropagation();setSide('back')">Bak</span>
      </div>
    </div>`;
}

function setSide(side) { State.manual.silhouetteSide = side; saveManual(); render(); }
function pickPhoto(ctx) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      State.manual.photos[State.manual.silhouetteSide] = reader.result;
      saveManual(); render();
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* ===================== Render: Kropp ===================== */
function renderBody() {
  const w = latestWithings(), pw = prevWithings();
  const bodyTransform = w
    ? `scale(${clamp(1 + ((w.fat_ratio ?? 18) - 18) * 0.012, 0.92, 1.1).toFixed(3)}, ${clamp(1 - ((w.muscle_mass ?? 40) - 40) * 0.006, 0.95, 1.05).toFixed(3)})`
    : 'scale(1,1)';
  const rec = effectiveRecovery();

  const statsFull = [
    { label: 'Vekt', value: w ? fmt1(w.weight) + ' kg' : '–', trend: trendArrow(w && w.weight, pw && pw.weight, false) },
    { label: 'Fettprosent', value: w && w.fat_ratio != null ? fmt1(w.fat_ratio) + ' %' : '–', trend: trendArrow(w && w.fat_ratio, pw && pw.fat_ratio, false) },
    { label: 'Muskelmasse', value: w && w.muscle_mass != null ? fmt1(w.muscle_mass) + ' kg' : '–', trend: trendArrow(w && w.muscle_mass, pw && pw.muscle_mass, true) },
    { label: 'Beinbygning', value: w && w.bone_mass != null ? fmt1(w.bone_mass) + ' kg' : '–', trend: trendArrow(w && w.bone_mass, pw && pw.bone_mass, true) },
  ];

  const recoveryRows = [
    { key: 'hrv', label: 'HRV', unit: 'ms', value: rec.hrv, manual: rec.hrvManual },
    { key: 'sleep', label: 'Søvn', unit: 't', value: rec.sleep, manual: rec.sleepManual },
    { key: 'bodyBattery', label: 'Body Battery', unit: '%', value: rec.bodyBattery, manual: rec.bbManual },
  ];

  // Vekt siste uker: multi-line av tilgjengelig historikk (vokser etter hvert)
  const weightSeries = State.withingsRows.map(r => r.weight);
  const muscleSeries = State.withingsRows.map(r => r.muscle_mass).filter(v => v != null);
  const fatSeries = State.withingsRows.map(r => r.fat_mass).filter(v => v != null);

  return `
    <h1 class="title">Kroppsdata</h1>
    <div class="card row gap16">
      ${renderSilhouette(130, 250, bodyTransform, 'body')}
      <div class="col gap16" style="flex:1;justify-content:center">
        ${statsFull.map(s => `
          <div class="col gap4" style="gap:3px">
            <div style="font-size:11px;color:var(--muted-55)">${s.label}</div>
            <div class="row" style="align-items:baseline;gap:6px">
              <span style="font-size:17px;font-weight:700;font-family:'Space Grotesk',sans-serif">${s.value}</span>
              <span style="font-size:11px;font-weight:600;color:${s.trend.color}">${s.trend.text}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card tight col gap14">
      <div class="row" style="justify-content:space-between;align-items:center">
        <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Restitusjon</div>
        <div style="font-size:9.5px;color:var(--muted-4)">fra Garmin, rediger ved behov</div>
      </div>
      ${recoveryRows.map(r => `
        <div class="row" style="align-items:center;justify-content:space-between;gap:10px">
          <div class="col" style="gap:2px">
            <div style="font-size:12.5px;font-weight:600">${r.label}</div>
            <div style="font-size:9.5px;color:${r.manual ? 'var(--accent)' : 'var(--muted-4)'}">${r.manual ? 'Manuelt' : 'Garmin'}</div>
          </div>
          <div class="row gap4">
            <input type="number" value="${r.value ?? ''}" onchange="setRecovery('${r.key}', this.value)" style="width:56px;padding:6px 8px;font-size:13px;font-weight:700;font-family:'Space Grotesk',sans-serif;text-align:right">
            <span style="font-size:11px;color:var(--muted-5)">${r.unit}</span>
          </div>
        </div>`).join('')}
    </div>

    <div class="card tight col gap10">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Vekt, muskel og fettvekt over tid</div>
      ${svgMultiLine([
        { data: weightSeries, color: 'var(--accent)' },
        { data: muscleSeries, color: 'var(--blue)' },
        { data: fatSeries, color: 'var(--orange)' },
      ], 320, 70).replace(/var\(--(\w[\w-]*)\)/g, (m, v) => getComputedStyle(document.documentElement).getPropertyValue('--' + v) || m)}
      <div class="row gap14" style="flex-wrap:wrap">
        <div class="row gap6"><div style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></div><span style="font-size:10.5px;color:var(--muted-6)">Vekt</span><span style="font-size:10.5px;font-weight:700">${w ? fmt1(w.weight)+' kg' : '–'}</span></div>
        <div class="row gap6"><div style="width:8px;height:8px;border-radius:50%;background:var(--blue)"></div><span style="font-size:10.5px;color:var(--muted-6)">Muskelvekt</span><span style="font-size:10.5px;font-weight:700">${w && w.muscle_mass!=null ? fmt1(w.muscle_mass)+' kg' : '–'}</span></div>
        <div class="row gap6"><div style="width:8px;height:8px;border-radius:50%;background:var(--orange)"></div><span style="font-size:10.5px;color:var(--muted-6)">Fettvekt</span><span style="font-size:10.5px;font-weight:700">${w && w.fat_mass!=null ? fmt1(w.fat_mass)+' kg' : '–'}</span></div>
      </div>
    </div>
  `;
}
function setRecovery(key, value) {
  const num = Number(value);
  if (key === 'hrv') { State.manual.hrv = num; State.manual.hrvManual = true; }
  if (key === 'sleep') { State.manual.sleep = num; State.manual.sleepManual = true; }
  if (key === 'bodyBattery') { State.manual.bodyBattery = num; State.manual.bbManual = true; }
  saveManual(); render();
}

/* ===================== Render: Logg ===================== */
function renderLog() {
  return `
    <h1 class="title">Treningslogg</h1>
    <div class="card empty-state">
      Strava er ikke koblet inn i dataflyten ennå. Når det er på plass dukker treningsøktene dine opp her automatisk, med type, distanse/varighet og kilde (Strava/Garmin).
    </div>
  `;
}

/* ===================== Render: Fremgang ===================== */
function renderProgress() {
  const weightSeries = State.withingsRows.map(r => r.weight);
  const fatSeries = State.withingsRows.map(r => r.fat_ratio).filter(v => v != null);
  return `
    <h1 class="title">Fremgang</h1>
    <div class="card tight col gap10">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Vekt (kg)</div>
      <div id="chart-weight"></div>
    </div>
    <div class="card tight col gap10">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Fettprosent (%)</div>
      <div id="chart-fat"></div>
    </div>
    <div class="card tight col gap10">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Treningsvolum (t/uke)</div>
      <div class="empty-state">Krever Strava — ikke koblet inn ennå.</div>
    </div>
  `;
}

/* ===================== Render: Kost ===================== */
function renderNutrition() {
  const m = State.manual;
  const hours = fastingHours(m.fastingStart, m.fastingEnd);
  const tips = coachTips().filter(t => t.includes('spisevindu') || t.includes('Spisevindu') || t.includes('mangler') || t.includes('avkrysset'));

  return `
    <h1 class="title">Kosthold</h1>
    <div class="card tight col gap12">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Spisevindu (periodisk faste)</div>
      <div class="row gap10" style="align-items:center">
        <input type="time" value="${m.fastingStart}" onchange="setFasting('start', this.value)" style="flex:1;padding:9px 10px;font-size:13px">
        <span style="font-size:12px;color:var(--muted-5)">—</span>
        <input type="time" value="${m.fastingEnd}" onchange="setFasting('end', this.value)" style="flex:1;padding:9px 10px;font-size:13px">
      </div>
      <div style="font-size:11px;color:var(--muted-5)">Spisevindu på ${hours} timer</div>
    </div>

    <div class="card tight col gap10">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Middelhavskost i dag</div>
      ${Object.entries(m.meals).map(([key, checked]) => `
        <div class="meal-row" onclick="toggleMeal('${key}')">
          <div class="meal-box" style="background:${checked ? 'var(--accent)' : 'transparent'};border:1px solid ${checked ? 'var(--accent)' : 'rgba(255,255,255,.25)'}">${checked ? '✓' : ''}</div>
          <div style="font-size:13px;color:${checked ? 'var(--text)' : 'var(--muted-6)'}">${MEAL_LABELS[key]}</div>
        </div>`).join('')}
    </div>

    <div class="card tight col gap8">
      <div style="font-size:12.5px;font-weight:600;color:var(--muted-75)">Notater om dagens måltider</div>
      <textarea oninput="setNotes(this.value)" placeholder="F.eks. frokost: gresk yoghurt med bær og valnøtter…" style="padding:10px 12px;font-size:13px;min-height:64px;resize:none">${esc(m.nutritionNotes)}</textarea>
    </div>

    <div class="teaser col gap8">
      <div style="font-size:12px;font-weight:600;color:var(--accent)">Coach om kosthold</div>
      ${tips.map(t => `<div style="font-size:11.5px;color:var(--muted-8);line-height:1.4">• ${esc(t)}</div>`).join('')}
    </div>
  `;
}
function setFasting(which, value) {
  if (which === 'start') State.manual.fastingStart = value; else State.manual.fastingEnd = value;
  saveManual(); render();
}
function toggleMeal(key) { State.manual.meals[key] = !State.manual.meals[key]; saveManual(); render(); }
function setNotes(value) { State.manual.nutritionNotes = value; saveManual(); }

/* ===================== Render: Coach ===================== */
function renderCoach() {
  const focus = dailyFocus();
  const messages = State.manual.chatMessages;
  return `
    <h1 class="title" style="margin-bottom:2px">Coach</h1>
    <div class="teaser col gap4">
      <div style="font-size:12px;font-weight:600;color:var(--accent)">Dagens fokus: ${esc(focus.label)}</div>
      <div style="font-size:11.5px;color:var(--muted-75);line-height:1.4">${esc(focus.text)}</div>
    </div>
    <div class="chat-thread" id="chatThread">
      ${messages.map(m => `
        <div class="row" style="justify-content:${m.from === 'coach' ? 'flex-start' : 'flex-end'}">
          <div class="chat-bubble" style="background:${m.from === 'coach' ? 'var(--card)' : 'var(--accent)'};color:${m.from === 'coach' ? 'var(--text)' : '#121212'}">${esc(m.text)}</div>
        </div>`).join('')}
    </div>
    <div class="row gap8" style="align-items:center">
      <input type="text" id="chatInput" placeholder="Skriv til coachen…" onkeydown="if(event.key==='Enter')sendChat()" style="flex:1;border:none;background:var(--card);padding:11px 14px;font-size:13px;border-radius:14px">
      <div onclick="sendChat()" style="width:38px;height:38px;border-radius:50%;background:var(--accent);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:#121212;font-weight:700">→</div>
    </div>
    <div style="font-size:10px;color:var(--muted-4);text-align:center">Regelbasert coach ut fra dine egne tall — ikke fri KI-samtale ennå.</div>
  `;
}
function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  State.manual.chatMessages.push({ from: 'user', text });
  State.manual.chatMessages.push({ from: 'coach', text: coachReply(text) });
  saveManual(); render();
  setTimeout(() => {
    const thread = document.getElementById('chatThread');
    if (thread) thread.scrollTop = thread.scrollHeight;
  }, 0);
}

/* ===================== Tab-bar ikoner ===================== */
function tabIcon(i, active) {
  const c = active ? 'var(--accent)' : 'var(--muted-4)';
  const icons = [
    `<div style="width:16px;height:16px;border-radius:4px;background:${c}"></div>`,
    `<div style="width:16px;height:16px;border-radius:50%;background:${c}"></div>`,
    `<div class="col gap2" style="height:16px;justify-content:center;gap:2px">
       <div style="width:16px;height:2.5px;border-radius:1px;background:${c}"></div>
       <div style="width:16px;height:2.5px;border-radius:1px;background:${c}"></div>
       <div style="width:16px;height:2.5px;border-radius:1px;background:${c}"></div>
     </div>`,
    `<div class="row gap2" style="align-items:flex-end;height:16px">
       <div style="width:4px;height:7px;background:${c}"></div>
       <div style="width:4px;height:11px;background:${c}"></div>
       <div style="width:4px;height:16px;background:${c}"></div>
     </div>`,
    `<div style="width:16px;height:16px;border-radius:50%;border:2.5px solid ${c};box-sizing:border-box"></div>`,
    `<div style="width:14px;height:14px;background:${c};transform:rotate(45deg)"></div>`,
  ];
  return icons[i];
}
function renderTabBar() {
  document.getElementById('tabBar').innerHTML = TABS.map((label, i) => `
    <div class="tab-btn" onclick="goTab(${i})">
      ${tabIcon(i, State.tab === i)}
      <div class="label" style="color:${State.tab === i ? 'var(--accent)' : 'var(--muted-4)'}">${label}</div>
    </div>`).join('');
}
function goTab(i) { State.tab = i; render(); }

/* ===================== Master render ===================== */
function render() {
  const renderers = [renderHome, renderBody, renderLog, renderProgress, renderNutrition, renderCoach];
  document.getElementById('content').innerHTML = renderers[State.tab]();
  renderTabBar();
  if (State.tab === 3) {
    document.getElementById('chart-weight').innerHTML = svgLine(State.withingsRows.map(r => r.weight), getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#c8ff3d', 320, 70);
    document.getElementById('chart-fat').innerHTML = svgLine(State.withingsRows.map(r => r.fat_ratio).filter(v => v != null), getComputedStyle(document.documentElement).getPropertyValue('--orange').trim(), 320, 70);
  }
}

/* ===================== Bootstrap ===================== */
render();
loadData();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>

</body>
</html>
